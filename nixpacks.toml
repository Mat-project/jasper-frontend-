# =============================================================================
# EOMS Frontend — Nixpacks Production Configuration
# =============================================================================

[providers]
providers = ["node"]

[variables]
NODE_VERSION = "22"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start -- -p ${PORT:-3000}"
